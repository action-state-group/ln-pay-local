[package]
name = "ln-pay-local"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Create and pay Lightning invoices between two local Lexe wallets, with no mesh-llm"
publish = false

[dependencies]
anyhow = "1"
fs2 = "0.4"
lexe = { version = "=0.1.24", features = ["unstable"] }
lexe-api-core = { version = "=0.1.24" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[[bin]]
name = "ln-pay-local"
path = "src/main.rs"
